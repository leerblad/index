<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Monster preview – v3</title>
  <style>
    body { background: #f8f8f8; min-height: 100vh; font-family: sans-serif; overflow-x: hidden; }
    h2 { text-align: center; font-weight: 300; color: #888; margin: 2rem 0 0.5rem; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }

    @keyframes bob       { 0%,100%{transform:translateY(0)}   50%{transform:translateY(-9px)} }
    @keyframes peek-up   { 0%,100%{transform:translateY(0)}   38%{transform:translateY(-22px)} 62%{transform:translateY(-22px)} }
    @keyframes peek-left { 0%,100%{transform:translateX(0)}   38%{transform:translateX(24px)}  62%{transform:translateX(24px)} }
    @keyframes peek-right{ 0%,100%{transform:translateX(0)}   38%{transform:translateX(-24px)} 62%{transform:translateX(-24px)} }
    @keyframes wiggle    { 0%,100%{transform:rotate(0)}       25%{transform:rotate(-7deg)}      75%{transform:rotate(7deg)} }
    @keyframes eye-blink { 0%,88%,100%{transform:scaleY(1)}   93%{transform:scaleY(0.07)} }

    .demo { position:relative; height:220px; border:1px dashed #ddd; border-radius:16px;
            margin:1rem 2rem; background:white; display:flex; align-items:center;
            justify-content:center; color:#ccc; font-size:13px; }
    .peek-bottom { position:absolute; bottom:-2px; animation: peek-up    3.8s ease-in-out infinite; }
    .peek-left   { position:absolute; left:-2px;   animation: peek-left  4.2s ease-in-out infinite; }
    .peek-right  { position:absolute; right:-2px;  animation: peek-right 4.5s ease-in-out infinite; }
    .floaty      { animation: bob 2.5s ease-in-out infinite; }
  </style>
</head>
<body>

<h2>Over de onderkant</h2>
<div class="demo">
  Pagina-inhoud

  <!-- GEEL – breed en gedrongen, ronde hoeken (rect-achtig lichaam) -->
  <div class="peek-bottom" style="left:70px">
    <svg width="96" height="74" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
      <!-- oren vast aan lichaam -->
      <rect x="10" y="4" width="14" height="22" rx="7" fill="#d4a000"/>
      <rect x="72" y="4" width="14" height="22" rx="7" fill="#d4a000"/>
      <!-- lichaam: breed afgerond rechthoek -->
      <rect x="2" y="18" width="92" height="72" rx="30" fill="#FFD000"/>
      <!-- ogen -->
      <circle cx="30" cy="52" r="13" fill="white"/>
      <circle cx="66" cy="52" r="13" fill="white"/>
      <g style="transform-origin:30px 54px; animation:eye-blink 4s ease-in-out infinite">
        <circle cx="31" cy="54" r="8" fill="#3a2a00"/>
        <circle cx="35" cy="50" r="3" fill="white"/>
      </g>
      <g style="transform-origin:66px 54px; animation:eye-blink 4s ease-in-out infinite .12s">
        <circle cx="67" cy="54" r="8" fill="#3a2a00"/>
        <circle cx="71" cy="50" r="3" fill="white"/>
      </g>
      <!-- wenkbrauwen nieuwsgierig -->
      <path d="M19 38 Q30 31 41 37" stroke="#3a2a00" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M55 37 Q66 31 77 38" stroke="#3a2a00" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- mond + tanden -->
      <path d="M26 70 Q48 86 70 70" fill="#c95000" stroke="#3a2a00" stroke-width="2" stroke-linecap="round"/>
      <rect x="34" y="70" width="9" height="6" rx="2" fill="white"/>
      <rect x="53" y="70" width="9" height="6" rx="2" fill="white"/>
      <!-- handjes over rand -->
      <rect x="-4" y="72" width="12" height="18" rx="6" fill="#FFD000"/>
      <rect x="88" y="72" width="12" height="18" rx="6" fill="#FFD000"/>
    </svg>
  </div>

  <!-- ROZE – peervorm (breed onder, smal boven) -->
  <div class="peek-bottom" style="right:90px; animation-delay:.9s; animation-duration:4.2s">
    <svg width="80" height="66" viewBox="0 0 80 88" xmlns="http://www.w3.org/2000/svg">
      <!-- 1 hoorntje midden vast -->
      <rect x="33" y="0" width="14" height="22" rx="7" fill="#d45c90"/>
      <!-- peervorm: smal boven, breed onder -->
      <path d="M40 14 C18 14 4 32 4 54 C4 74 18 84 40 84 C62 84 76 74 76 54 C76 32 62 14 40 14Z" fill="#FF7EB3"/>
      <!-- 1 groot oog -->
      <circle cx="40" cy="46" r="16" fill="white"/>
      <g style="transform-origin:40px 48px; animation:eye-blink 3.6s ease-in-out infinite .5s">
        <circle cx="40" cy="48" r="10" fill="#5a0030"/>
        <circle cx="45" cy="43" r="3.5" fill="white"/>
      </g>
      <path d="M21 38 Q40 30 59 38" stroke="#5a0030" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M24 64 Q40 76 56 64" stroke="#5a0030" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- handjes -->
      <rect x="-2" y="62" width="11" height="16" rx="5.5" fill="#FF7EB3"/>
      <rect x="71" y="62" width="11" height="16" rx="5.5" fill="#FF7EB3"/>
    </svg>
  </div>
</div>

<h2>Over de zijkant</h2>
<div class="demo">
  Pagina-inhoud

  <!-- ORANJE – blokkerig vierkant lichaam -->
  <div class="peek-left" style="top:35px">
    <svg width="66" height="88" viewBox="0 0 88 110" xmlns="http://www.w3.org/2000/svg">
      <!-- oren bovenop vast -->
      <rect x="18" y="0" width="13" height="20" rx="6.5" fill="#c95000"/>
      <rect x="57" y="0" width="13" height="20" rx="6.5" fill="#c95000"/>
      <!-- vierkant lichaam met ronde hoeken -->
      <rect x="4" y="14" width="80" height="80" rx="22" fill="#FF6B1A"/>
      <!-- ogen -->
      <circle cx="28" cy="52" r="13" fill="white"/>
      <circle cx="60" cy="52" r="13" fill="white"/>
      <g style="transform-origin:28px 54px; animation:eye-blink 3.9s ease-in-out infinite .2s">
        <circle cx="29" cy="54" r="8" fill="#3a1500"/>
        <circle cx="33" cy="50" r="2.5" fill="white"/>
      </g>
      <g style="transform-origin:60px 54px; animation:eye-blink 3.9s ease-in-out infinite .3s">
        <circle cx="61" cy="54" r="8" fill="#3a1500"/>
        <circle cx="65" cy="50" r="2.5" fill="white"/>
      </g>
      <!-- wenkbrauwen schuin nieuwsgierig -->
      <path d="M17 38 Q28 31 39 37" stroke="#3a1500" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M49 37 Q60 31 71 38" stroke="#3a1500" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- mond -->
      <path d="M22 72 Q44 90 66 72" fill="#c95000" stroke="#3a1500" stroke-width="2" stroke-linecap="round"/>
      <rect x="38" y="72" width="12" height="7" rx="2.5" fill="white"/>
      <!-- voetjes onderkant -->
      <rect x="14" y="90" width="22" height="16" rx="11" fill="#c95000"/>
      <rect x="52" y="90" width="22" height="16" rx="11" fill="#c95000"/>
    </svg>
  </div>

  <!-- GROEN – druppelvorm (breed boven, smal onder) -->
  <div class="peek-right" style="bottom:28px; animation-delay:1.1s">
    <svg width="66" height="90" viewBox="0 0 88 112" xmlns="http://www.w3.org/2000/svg">
      <!-- 3 kleine uitstulpingen bovenop vast -->
      <circle cx="30" cy="12" r="10" fill="#2d8a2d"/>
      <circle cx="44" cy="7"  r="10" fill="#2d8a2d"/>
      <circle cx="58" cy="12" r="10" fill="#2d8a2d"/>
      <!-- druppelvorm: breed boven smal onder -->
      <path d="M44 10 C16 10 6 28 6 50 C6 78 20 100 44 102 C68 100 82 78 82 50 C82 28 72 10 44 10Z" fill="#4CAF50"/>
      <!-- ogen -->
      <circle cx="30" cy="50" r="12" fill="white"/>
      <circle cx="58" cy="50" r="12" fill="white"/>
      <g style="transform-origin:30px 52px; animation:eye-blink 4.1s ease-in-out infinite .7s">
        <circle cx="30" cy="52" r="7.5" fill="#1a3a1a"/>
        <circle cx="34" cy="48" r="2.5" fill="white"/>
      </g>
      <g style="transform-origin:58px 52px; animation:eye-blink 4.1s ease-in-out infinite .8s">
        <circle cx="58" cy="52" r="7.5" fill="#1a3a1a"/>
        <circle cx="62" cy="48" r="2.5" fill="white"/>
      </g>
      <path d="M26 38 Q30 32 38 36" stroke="#1a3a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M50 36 Q58 32 62 38" stroke="#1a3a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M26 68 Q44 82 62 68" stroke="#1a3a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <rect x="32" y="68" width="8" height="6" rx="2" fill="white"/>
      <rect x="48" y="68" width="8" height="6" rx="2" fill="white"/>
      <!-- voetjes -->
      <rect x="20" y="98" width="20" height="12" rx="10" fill="#2d8a2d"/>
      <rect x="48" y="98" width="20" height="12" rx="10" fill="#2d8a2d"/>
    </svg>
  </div>
</div>

<h2>Zwevend (vrij op pagina)</h2>
<div class="demo" style="height:210px">
  Pagina-inhoud

  <!-- ROOD – ster/blob met bobbels rondom -->
  <div class="floaty" style="position:absolute;right:55px;top:22px;animation-duration:2.2s">
    <svg width="82" height="98" viewBox="0 0 100 118" xmlns="http://www.w3.org/2000/svg"
         style="animation:wiggle 3.2s ease-in-out infinite;transform-origin:50% 100%">
      <!-- bobbels bovenop als oren/haren vast -->
      <circle cx="28" cy="18" r="11" fill="#b71c1c"/>
      <circle cx="50" cy="10" r="11" fill="#b71c1c"/>
      <circle cx="72" cy="18" r="11" fill="#b71c1c"/>
      <!-- blob lichaam -->
      <path d="M50 16 C24 16 8 34 8 58 C8 82 24 104 50 106 C76 104 92 82 92 58 C92 34 76 16 50 16Z" fill="#E53935"/>
      <!-- ogen -->
      <circle cx="34" cy="58" r="13" fill="white"/>
      <circle cx="66" cy="58" r="13" fill="white"/>
      <g style="transform-origin:34px 60px; animation:eye-blink 3.7s ease-in-out infinite .1s">
        <circle cx="35" cy="60" r="8" fill="#3a0000"/>
        <circle cx="39" cy="56" r="3" fill="white"/>
      </g>
      <g style="transform-origin:66px 60px; animation:eye-blink 3.7s ease-in-out infinite .2s">
        <circle cx="67" cy="60" r="8" fill="#3a0000"/>
        <circle cx="71" cy="56" r="3" fill="white"/>
      </g>
      <path d="M30 80 Q50 96 70 80" fill="#b71c1c" stroke="#3a0000" stroke-width="2" stroke-linecap="round"/>
      <rect x="44" y="80" width="12" height="7" rx="2.5" fill="white"/>
      <!-- armpjes -->
      <rect x="-2"  cy="72" x="-2" y="68" width="12" height="20" rx="6" fill="#E53935"/>
      <rect x="90" y="68" width="12" height="20" rx="6" fill="#E53935"/>
      <!-- voetjes -->
      <rect x="20" y="102" width="22" height="14" rx="11" fill="#b71c1c"/>
      <rect x="58" y="102" width="22" height="14" rx="11" fill="#b71c1c"/>
    </svg>
  </div>

  <!-- LILA – zeshoekig/diamant-achtig lichaam -->
  <div class="floaty" style="position:absolute;left:50px;bottom:18px;animation-duration:3s;animation-delay:.7s">
    <svg width="76" height="88" viewBox="0 0 96 110" xmlns="http://www.w3.org/2000/svg"
         style="animation:wiggle 3.8s ease-in-out infinite 1.2s;transform-origin:50% 100%">
      <!-- antennes vast -->
      <rect x="31" y="0" width="10" height="20" rx="5" fill="#6a0dad"/>
      <circle cx="36" cy="2" r="7" fill="#9b30ff"/>
      <rect x="55" y="0" width="10" height="20" rx="5" fill="#6a0dad"/>
      <circle cx="60" cy="2" r="7" fill="#ce93d8"/>
      <!-- zeshoek-achtig lichaam via path -->
      <path d="M48 12 C28 12 8 26 8 52 C8 76 24 100 48 102 C72 100 88 76 88 52 C88 26 68 12 48 12Z" fill="#AB47BC"/>
      <!-- ogen -->
      <circle cx="32" cy="54" r="13" fill="white"/>
      <circle cx="64" cy="54" r="13" fill="white"/>
      <g style="transform-origin:32px 56px; animation:eye-blink 4.3s ease-in-out infinite">
        <circle cx="33" cy="56" r="8" fill="#2a0050"/>
        <circle cx="37" cy="52" r="3" fill="white"/>
      </g>
      <g style="transform-origin:64px 56px; animation:eye-blink 4.3s ease-in-out infinite .15s">
        <circle cx="65" cy="56" r="8" fill="#2a0050"/>
        <circle cx="69" cy="52" r="3" fill="white"/>
      </g>
      <!-- mond -->
      <path d="M28 74 Q48 90 68 74" stroke="#2a0050" stroke-width="2.5" fill="#f48fb1" stroke-linecap="round"/>
      <rect x="36" y="74" width="8" height="6" rx="2" fill="white"/>
      <rect x="52" y="74" width="8" height="6" rx="2" fill="white"/>
      <!-- voetjes -->
      <rect x="18" y="98" width="22" height="12" rx="11" fill="#6a0dad"/>
      <rect x="56" y="98" width="22" height="12" rx="11" fill="#6a0dad"/>
    </svg>
  </div>
</div>

</body>
</html>
