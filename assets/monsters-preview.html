<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Monster preview</title>
  <style>
    body { background: #f8f8f8; display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; font-family: sans-serif; }
    figure { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    figcaption { font-size: 12px; color: #888; }
  </style>
</head>
<body>

<!-- Monster 1: geel, 1 oog, 2 hoorntjes -->
<figure>
<svg width="100" height="120" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
  <!-- hoorntjes -->
  <ellipse cx="35" cy="14" rx="6" ry="10" fill="#e6a800" transform="rotate(-15 35 14)"/>
  <ellipse cx="65" cy="14" rx="6" ry="10" fill="#e6a800" transform="rotate(15 65 14)"/>
  <!-- lichaam -->
  <ellipse cx="50" cy="72" rx="38" ry="44" fill="#FFD000"/>
  <!-- oog wit -->
  <circle cx="50" cy="62" r="18" fill="white"/>
  <!-- iris -->
  <circle cx="50" cy="64" r="11" fill="#3a2a00"/>
  <!-- glinstering -->
  <circle cx="55" cy="59" r="4" fill="white"/>
  <!-- mond -->
  <path d="M 34 87 Q 50 102 66 87" stroke="#3a2a00" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- tandjes -->
  <rect x="41" y="87" width="7" height="6" rx="1.5" fill="white"/>
  <rect x="52" y="87" width="7" height="6" rx="1.5" fill="white"/>
  <!-- armpjes -->
  <ellipse cx="12" cy="78" rx="8" ry="13" fill="#FFD000" transform="rotate(20 12 78)"/>
  <ellipse cx="88" cy="78" rx="8" ry="13" fill="#FFD000" transform="rotate(-20 88 78)"/>
  <!-- voetjes -->
  <ellipse cx="36" cy="114" rx="12" ry="7" fill="#e6a800"/>
  <ellipse cx="64" cy="114" rx="12" ry="7" fill="#e6a800"/>
</svg>
<figcaption>Monster 1 – Geel</figcaption>
</figure>

<!-- Monster 2: paars, 2 ogen, antennes -->
<figure>
<svg width="100" height="125" viewBox="0 0 100 125" xmlns="http://www.w3.org/2000/svg">
  <!-- antennes -->
  <line x1="38" y1="22" x2="30" y2="4" stroke="#6a0dad" stroke-width="3" stroke-linecap="round"/>
  <circle cx="30" cy="4" r="5" fill="#9b30ff"/>
  <line x1="62" y1="22" x2="70" y2="4" stroke="#6a0dad" stroke-width="3" stroke-linecap="round"/>
  <circle cx="70" cy="4" r="5" fill="#9b30ff"/>
  <!-- lichaam -->
  <ellipse cx="50" cy="74" rx="36" ry="46" fill="#9b30ff"/>
  <!-- ogen wit -->
  <circle cx="36" cy="65" r="13" fill="white"/>
  <circle cx="64" cy="65" r="13" fill="white"/>
  <!-- irissen -->
  <circle cx="37" cy="67" r="8" fill="#2a0050"/>
  <circle cx="65" cy="67" r="8" fill="#2a0050"/>
  <!-- glinstering -->
  <circle cx="40" cy="63" r="3" fill="white"/>
  <circle cx="68" cy="63" r="3" fill="white"/>
  <!-- mond blij -->
  <path d="M 34 88 Q 50 104 66 88" stroke="#2a0050" stroke-width="3" fill="#ff6b9d" stroke-linecap="round"/>
  <!-- tandjes -->
  <rect x="40" y="88" width="6" height="5" rx="1.5" fill="white"/>
  <rect x="54" y="88" width="6" height="5" rx="1.5" fill="white"/>
  <!-- voetjes -->
  <ellipse cx="36" cy="118" rx="12" ry="7" fill="#6a0dad"/>
  <ellipse cx="64" cy="118" rx="12" ry="7" fill="#6a0dad"/>
</svg>
<figcaption>Monster 2 – Paars</figcaption>
</figure>

<!-- Monster 3: teal/blauwgroen, 1 groot oog, bolletjes boven -->
<figure>
<svg width="95" height="120" viewBox="0 0 95 120" xmlns="http://www.w3.org/2000/svg">
  <!-- hoorntje midden -->
  <ellipse cx="47" cy="10" rx="7" ry="12" fill="#007a7a"/>
  <!-- lichaam eirond -->
  <ellipse cx="47" cy="72" rx="34" ry="44" fill="#00BFBF"/>
  <!-- groot oog -->
  <circle cx="47" cy="62" r="20" fill="white"/>
  <circle cx="47" cy="65" r="12" fill="#003f3f"/>
  <circle cx="53" cy="59" r="5" fill="white"/>
  <!-- mond tanden tonen -->
  <path d="M 30 86 Q 47 103 64 86" fill="#003f3f"/>
  <rect x="36" y="86" width="7" height="7" rx="2" fill="white"/>
  <rect x="47" y="86" width="7" height="7" rx="2" fill="white"/>
  <!-- armpjes -->
  <ellipse cx="13" cy="76" rx="7" ry="12" fill="#00BFBF" transform="rotate(25 13 76)"/>
  <ellipse cx="81" cy="76" rx="7" ry="12" fill="#00BFBF" transform="rotate(-25 81 76)"/>
  <!-- voetjes -->
  <ellipse cx="34" cy="114" rx="11" ry="7" fill="#007a7a"/>
  <ellipse cx="60" cy="114" rx="11" ry="7" fill="#007a7a"/>
</svg>
<figcaption>Monster 3 – Teal</figcaption>
</figure>

<!-- Monster 4: oranje, 2 ogen, hoorntjes schuin -->
<figure>
<svg width="100" height="118" viewBox="0 0 100 118" xmlns="http://www.w3.org/2000/svg">
  <!-- hoorntjes schuin -->
  <ellipse cx="33" cy="13" rx="5" ry="11" fill="#c95000" transform="rotate(-20 33 13)"/>
  <ellipse cx="67" cy="13" rx="5" ry="11" fill="#c95000" transform="rotate(20 67 13)"/>
  <!-- lichaam -->
  <ellipse cx="50" cy="70" rx="37" ry="44" fill="#FF6B1A"/>
  <!-- ogen -->
  <circle cx="35" cy="62" r="12" fill="white"/>
  <circle cx="65" cy="62" r="12" fill="white"/>
  <circle cx="36" cy="64" r="7" fill="#3a1500"/>
  <circle cx="66" cy="64" r="7" fill="#3a1500"/>
  <circle cx="39" cy="61" r="3" fill="white"/>
  <circle cx="69" cy="61" r="3" fill="white"/>
  <!-- brede glimlach -->
  <path d="M 30 84 Q 50 106 70 84" fill="#c95000"/>
  <path d="M 30 84 Q 50 106 70 84" stroke="#3a1500" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- tand midden -->
  <rect x="44" y="84" width="12" height="7" rx="2" fill="white"/>
  <!-- voetjes -->
  <ellipse cx="35" cy="112" rx="12" ry="7" fill="#c95000"/>
  <ellipse cx="65" cy="112" rx="12" ry="7" fill="#c95000"/>
</svg>
<figcaption>Monster 4 – Oranje</figcaption>
</figure>

<!-- Monster 5: roze/koraal, klein, kijkt over rand -->
<figure>
<svg width="100" height="80" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
  <!-- "rand" -->
  <rect x="0" y="58" width="100" height="22" rx="4" fill="#e5e5e5"/>
  <!-- lichaam half zichtbaar -->
  <ellipse cx="50" cy="72" rx="36" ry="44" fill="#FF7EB3"/>
  <!-- hoorntjes -->
  <ellipse cx="34" cy="24" rx="5" ry="9" fill="#d45c90" transform="rotate(-10 34 24)"/>
  <ellipse cx="66" cy="24" rx="5" ry="9" fill="#d45c90" transform="rotate(10 66 24)"/>
  <!-- ogen -->
  <circle cx="36" cy="46" r="11" fill="white"/>
  <circle cx="64" cy="46" r="11" fill="white"/>
  <circle cx="37" cy="48" r="7" fill="#5a0030"/>
  <circle cx="65" cy="48" r="7" fill="#5a0030"/>
  <circle cx="40" cy="44" r="3" fill="white"/>
  <circle cx="68" cy="44" r="3" fill="white"/>
  <!-- glimlach klein -->
  <path d="M 36 60 Q 50 70 64 60" stroke="#5a0030" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
<figcaption>Monster 5 – Over de rand</figcaption>
</figure>

</body>
</html>
