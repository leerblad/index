<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Leerblad – Tafelsnake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      background: #0e1117;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Topbar ── */
    .topbar { background: rgba(255,255,255,0.04); border-bottom: 0.5px solid rgba(255,255,255,0.08); }
    .topbar-inner { max-width: 1280px; margin: 0 auto; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 1rem; }
    .logo-link { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; flex-shrink: 0; }
    .logo-text { font-size: 28px; font-weight: 200; letter-spacing: 1.5px; background: linear-gradient(90deg, #2A7FD4, #2DBF8E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.1; }
    .logo-tagline-row { display: flex; align-items: center; gap: 6px; }
    .logo-tagline-line { height: 1px; width: 24px; background: linear-gradient(90deg, #2A7FD4, #2DBF8E); opacity: 0.4; }
    .logo-tagline { font-size: 7px; letter-spacing: 3px; color: #2A7FD4; font-weight: 400; text-transform: uppercase; }
    .back-btn { font-size: 13px; color: rgba(255,255,255,0.45); text-decoration: none; padding: 7px 16px; border: 0.5px solid rgba(255,255,255,0.12); border-radius: 20px; transition: all 0.15s; }
    .back-btn:hover { color: #fff; border-color: rgba(255,255,255,0.3); }

    /* ── Game wrapper ── */
    .game-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem 2rem;
      gap: 0;
    }

    /* ── Question display ── */
    .question-bar {
      width: 100%;
      max-width: 480px;
      text-align: center;
      margin-bottom: 14px;
    }
    .question-label {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 6px;
    }
    .question-text {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #2A7FD4, #2DBF8E);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .question-text.hidden { opacity: 0; }

    /* ── Score bar ── */
    .score-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .score-item { text-align: center; }
    .score-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-bottom: 2px; }
    .score-value { font-size: 22px; font-weight: 700; color: #fff; }
    .score-value.hs { background: linear-gradient(90deg, #f7971e, #ffd200); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    /* ── Canvas container ── */
    .canvas-container {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 24px 64px rgba(0,0,0,0.6);
    }
    canvas { display: block; }

    /* ── Overlay (start / game-over) ── */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(14,17,23,0.88);
      backdrop-filter: blur(6px);
      border-radius: 16px;
      transition: opacity 0.25s;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay-emoji { font-size: 52px; line-height: 1; }
    .overlay-title { font-size: 26px; font-weight: 800; color: #fff; }
    .overlay-sub { font-size: 13px; color: rgba(255,255,255,0.45); text-align: center; max-width: 260px; line-height: 1.6; }
    .overlay-score { font-size: 16px; font-weight: 600; }
    .overlay-score span { background: linear-gradient(90deg, #2A7FD4, #2DBF8E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    .start-btn {
      margin-top: 4px;
      font-size: 15px;
      font-weight: 600;
      background: linear-gradient(90deg, #2A7FD4, #2DBF8E);
      color: #fff;
      border: none;
      padding: 13px 36px;
      border-radius: 30px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      letter-spacing: 0.3px;
    }
    .start-btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .start-btn:active { transform: translateY(0); }

    /* ── D-pad (mobile) ── */
    .dpad {
      display: grid;
      grid-template-areas: ". up ." "left . right" ". down .";
      gap: 6px;
      margin-top: 18px;
    }
    .dpad-btn {
      width: 52px;
      height: 52px;
      background: rgba(255,255,255,0.06);
      border: 0.5px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: rgba(255,255,255,0.7);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, transform 0.08s;
      user-select: none;
      -webkit-user-select: none;
    }
    .dpad-btn:active { background: rgba(42,127,212,0.3); transform: scale(0.93); }
    .dpad-up    { grid-area: up; }
    .dpad-left  { grid-area: left; }
    .dpad-right { grid-area: right; }
    .dpad-down  { grid-area: down; }

    /* ── Footer ── */
    footer { border-top: 0.5px solid rgba(255,255,255,0.06); background: transparent; padding: 1rem 0; text-align: center; font-size: 11px; color: rgba(255,255,255,0.2); }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="logo-link" href="../index.html">
      <span class="logo-text">Leerblad</span>
      <div class="logo-tagline-row"><div class="logo-tagline-line"></div><div class="logo-tagline">Werkbladen op maat</div><div class="logo-tagline-line"></div></div>
    </a>
    <a class="back-btn" href="tafelspellen.html">← Tafelspellen</a>
  </div>
</header>

<div class="game-wrapper">

  <!-- Vraag -->
  <div class="question-bar">
    <div class="question-label">Wat is het antwoord?</div>
    <div class="question-text hidden" id="questionText">— × — = ?</div>
  </div>

  <!-- Score -->
  <div class="score-bar">
    <div class="score-item">
      <div class="score-label">Score</div>
      <div class="score-value" id="scoreDisplay">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">Highscore</div>
      <div class="score-value hs" id="hsDisplay">0</div>
    </div>
  </div>

  <!-- Canvas -->
  <div class="canvas-container" id="canvasContainer">
    <canvas id="gameCanvas"></canvas>

    <!-- Overlay -->
    <div class="overlay" id="overlay">
      <div class="overlay-emoji">🐍</div>
      <div class="overlay-title">Tafelsnake</div>
      <div class="overlay-sub" id="overlayMsg">Stuur de slang naar het <strong>juiste antwoord</strong>. Eet het foute getal op en je bent af!</div>
      <div class="overlay-score" id="overlayScore" style="display:none"></div>
      <button class="start-btn" id="startBtn" onclick="startGame()">Start</button>
    </div>
  </div>

  <!-- D-pad voor mobiel -->
  <div class="dpad">
    <button class="dpad-btn dpad-up"    onclick="setDir(0,-1)">▲</button>
    <button class="dpad-btn dpad-left"  onclick="setDir(-1,0)">◀</button>
    <button class="dpad-btn dpad-right" onclick="setDir(1,0)">▶</button>
    <button class="dpad-btn dpad-down"  onclick="setDir(0,1)">▼</button>
  </div>

</div>

<footer>www.leerblad.nl</footer>

<script>
  /* ── Configuratie ── */
  const COLS    = 20;
  const ROWS    = 20;
  const BASE_MS = 140;   // ms per tick bij start
  const MIN_MS  = 70;    // snelste snelheid

  /* ── Canvas setup (responsive) ── */
  const canvas    = document.getElementById('gameCanvas');
  const ctx       = canvas.getContext('2d');
  const container = document.getElementById('canvasContainer');

  function setCellSize() {
    const vw   = Math.min(window.innerWidth - 32, 480);
    const cell = Math.floor(vw / COLS);
    canvas.width  = cell * COLS;
    canvas.height = cell * ROWS;
    container.style.width  = canvas.width  + 'px';
    container.style.height = canvas.height + 'px';
    return cell;
  }
  let CELL = setCellSize();
  window.addEventListener('resize', () => { CELL = setCellSize(); if (!running) drawIdle(); });

  /* ── State ── */
  let snake       = [];
  let dir         = { x: 1, y: 0 };
  let nextDir     = { x: 1, y: 0 };
  let goodFood    = null;
  let badFood     = null;
  let score       = 0;
  let highScore   = +localStorage.getItem('tafelsnake_hs') || 0;
  let running     = false;
  let loopTimer   = null;
  let tickMs      = BASE_MS;
  let question    = null;
  let gameOverFlag = false;

  /* ── Vraag genereren ── */
  function newQuestion() {
    const a = Math.floor(Math.random() * 10) + 1;
    const b = Math.floor(Math.random() * 10) + 1;
    const correct = a * b;

    /* Fout antwoord: dichtbij maar anders, altijd > 0 */
    const offsets = [-6,-5,-4,-3,-2,-1,1,2,3,4,5,6].filter(o => correct + o > 0);
    const offset  = offsets[Math.floor(Math.random() * offsets.length)];
    const wrong   = correct + offset;

    question = { a, b, correct, wrong };
    document.getElementById('questionText').textContent = `${a} × ${b} = ?`;
    document.getElementById('questionText').classList.remove('hidden');
    placeFoods();
  }

  /* ── Voedsel plaatsen ── */
  function emptyCell() {
    let pos, tries = 0;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      tries++;
    } while (tries < 400 && (
      snake.some(s => s.x === pos.x && s.y === pos.y) ||
      (goodFood && pos.x === goodFood.x && pos.y === goodFood.y) ||
      (badFood  && pos.x === badFood.x  && pos.y === badFood.y)
    ));
    return pos;
  }

  function placeFoods() {
    goodFood = emptyCell();
    badFood  = emptyCell();
    /* Wissel soms goed/slecht zodat positie varieert */
    if (Math.random() < 0.5) { const t = goodFood; goodFood = badFood; badFood = t; }
  }

  /* ── Spel starten ── */
  function startGame() {
    /* Slang begint midden, lengte 2, richting rechts */
    const mx = Math.floor(COLS / 2);
    const my = Math.floor(ROWS / 2);
    snake   = [{ x: mx, y: my }, { x: mx - 1, y: my }];
    dir     = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score   = 0;
    tickMs  = BASE_MS;
    gameOverFlag = false;
    running = true;

    document.getElementById('scoreDisplay').textContent = '0';
    document.getElementById('hsDisplay').textContent    = highScore;
    document.getElementById('overlay').classList.add('hidden');

    newQuestion();
    clearTimeout(loopTimer);
    loopTimer = setTimeout(tick, tickMs);
  }

  /* ── Richting instellen ── */
  function setDir(dx, dy) {
    /* Mag niet 180° omdraaien */
    if (dx !== 0 && dir.x !== 0) return;
    if (dy !== 0 && dir.y !== 0) return;
    nextDir = { x: dx, y: dy };
  }

  document.addEventListener('keydown', e => {
    switch (e.key) {
      case 'ArrowUp':    e.preventDefault(); setDir(0, -1); break;
      case 'ArrowDown':  e.preventDefault(); setDir(0,  1); break;
      case 'ArrowLeft':  e.preventDefault(); setDir(-1, 0); break;
      case 'ArrowRight': e.preventDefault(); setDir(1,  0); break;
    }
  });

  /* ── Swipe (mobiel) ── */
  let touchStart = null;
  document.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else                              setDir(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  /* ── Game loop ── */
  function tick() {
    dir = { ...nextDir };
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    /* Muur */
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { gameOver('muur'); return; }
    /* Zichzelf */
    if (snake.some(s => s.x === head.x && s.y === head.y)) { gameOver('zichzelf'); return; }

    snake.unshift(head);

    /* Goed antwoord opgegeten */
    if (head.x === goodFood.x && head.y === goodFood.y) {
      score += question.correct;
      document.getElementById('scoreDisplay').textContent = score;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('tafelsnake_hs', highScore);
        document.getElementById('hsDisplay').textContent = highScore;
      }
      /* Snelheid iets omhoog */
      tickMs = Math.max(MIN_MS, tickMs - 3);
      newQuestion();
    } else if (head.x === badFood.x && head.y === badFood.y) {
      /* Fout antwoord: game over, maar toon even de slang */
      snake.pop();
      draw();
      gameOver('fout');
      return;
    } else {
      snake.pop(); /* geen eten: staart weg */
    }

    draw();
    loopTimer = setTimeout(tick, tickMs);
  }

  /* ── Game over ── */
  function gameOver(reden) {
    running = false;
    clearTimeout(loopTimer);
    gameOverFlag = true;
    drawGameOver();

    const overlay     = document.getElementById('overlay');
    const btn         = document.getElementById('startBtn');
    const msg         = document.getElementById('overlayMsg');
    const scoreEl     = document.getElementById('overlayScore');
    const emoji       = overlay.querySelector('.overlay-emoji');
    const title       = overlay.querySelector('.overlay-title');

    emoji.textContent = reden === 'fout' ? '❌' : '💥';
    title.textContent = 'Game over!';

    const redenTekst = reden === 'fout'
      ? `Je at het foute antwoord op: <strong>${question.wrong}</strong>`
      : reden === 'muur'
      ? 'Je vloog tegen de muur!'
      : 'Je beet in je eigen staart!';

    msg.innerHTML   = redenTekst;
    scoreEl.innerHTML = `Score: <span>${score}</span>`;
    scoreEl.style.display = 'block';
    btn.textContent = 'Opnieuw';

    overlay.classList.remove('hidden');
  }

  /* ── Tekenen ── */
  const COLORS = {
    bg:        '#0e1117',
    grid:      'rgba(255,255,255,0.03)',
    snakeHead: ['#2A7FD4', '#2DBF8E'],
    snakeTail: ['#1a5fa0', '#1a9068'],
    goodBg:    '#00e676',
    goodText:  '#003d1a',
    badBg:     '#ff1744',
    badText:   '#fff',
  };

  function drawGrid() {
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth   = 0.5;
    for (let c = 0; c <= COLS; c++) {
      ctx.beginPath(); ctx.moveTo(c * CELL, 0); ctx.lineTo(c * CELL, ROWS * CELL); ctx.stroke();
    }
    for (let r = 0; r <= ROWS; r++) {
      ctx.beginPath(); ctx.moveTo(0, r * CELL); ctx.lineTo(COLS * CELL, r * CELL); ctx.stroke();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawSnake() {
    const len = snake.length;
    snake.forEach((seg, i) => {
      const t   = i / Math.max(len - 1, 1);
      const pad = i === 0 ? 1 : 2;
      const r   = i === 0 ? Math.max(4, CELL / 4) : Math.max(3, CELL / 5);

      /* Interpoleer kleur van hoofd naar staart */
      const r1 = parseInt(COLORS.snakeHead[0].slice(1,3), 16);
      const g1 = parseInt(COLORS.snakeHead[0].slice(3,5), 16);
      const b1 = parseInt(COLORS.snakeHead[0].slice(5,7), 16);
      const r2 = parseInt(COLORS.snakeTail[0].slice(1,3), 16);
      const g2 = parseInt(COLORS.snakeTail[0].slice(3,5), 16);
      const b2 = parseInt(COLORS.snakeTail[0].slice(5,7), 16);
      const ri = Math.round(r1 + (r2 - r1) * t);
      const gi = Math.round(g1 + (g2 - g1) * t);
      const bi = Math.round(b1 + (b2 - b1) * t);

      ctx.fillStyle = `rgb(${ri},${gi},${bi})`;
      roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, r);
      ctx.fill();

      /* Ogen op hoofd */
      if (i === 0) {
        ctx.fillStyle = '#fff';
        const ePad = CELL * 0.22;
        const eR   = Math.max(1.5, CELL * 0.1);
        if (dir.x !== 0) {
          ctx.beginPath(); ctx.arc(seg.x * CELL + CELL * (dir.x > 0 ? 0.7 : 0.3), seg.y * CELL + CELL * 0.3, eR, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(seg.x * CELL + CELL * (dir.x > 0 ? 0.7 : 0.3), seg.y * CELL + CELL * 0.7, eR, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.beginPath(); ctx.arc(seg.x * CELL + CELL * 0.3, seg.y * CELL + CELL * (dir.y > 0 ? 0.7 : 0.3), eR, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(seg.x * CELL + CELL * 0.7, seg.y * CELL + CELL * (dir.y > 0 ? 0.7 : 0.3), eR, 0, Math.PI * 2); ctx.fill();
        }
      }
    });
  }

  function drawFood(food, bgColor, textColor, value, pulse) {
    if (!food) return;
    const cx   = food.x * CELL + CELL / 2;
    const cy   = food.y * CELL + CELL / 2;
    const rad  = CELL / 2 - 2;

    /* Glow */
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad * 2);
    glow.addColorStop(0, bgColor + '55');
    glow.addColorStop(1, bgColor + '00');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, rad * 2, 0, Math.PI * 2); ctx.fill();

    /* Cirkel */
    ctx.fillStyle = bgColor;
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.fill();

    /* Getal */
    const label = String(value);
    const fs    = label.length > 2 ? Math.max(9, CELL * 0.38) : Math.max(10, CELL * 0.44);
    ctx.fillStyle  = textColor;
    ctx.font       = `700 ${fs}px Inter, sans-serif`;
    ctx.textAlign  = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, cx, cy + 0.5);
  }

  function draw() {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    if (goodFood) drawFood(goodFood, COLORS.goodBg, COLORS.goodText, question.correct);
    if (badFood)  drawFood(badFood,  COLORS.badBg,  COLORS.badText,  question.wrong);
    drawSnake();
  }

  function drawGameOver() {
    /* Flash rood over het veld */
    ctx.fillStyle = 'rgba(255,23,68,0.18)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function drawIdle() {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawGrid();
  }

  /* ── Init ── */
  document.getElementById('hsDisplay').textContent = highScore;
  drawIdle();
</script>
</body>
</html>
